[workspace]
resolver = "2"
members = [
    "crates/prowlcat-types",
    "crates/prowlcat-cli",
    "crates/prowlcat-core",
    "crates/prowlcat-source",
    "crates/prowlcat-decode",
    "crates/prowlcat-match",
    "crates/prowlcat-output",
    "crates/prowlcat-index",
    "crates/prowlcat-tui",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/m0s-s/ProwlCat"
authors = ["ProwlCat Contributors"]
description = "Local-first high-performance breach corpus search"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
rayon = "1"
walkdir = "2"
glob = "0.3"
memchr = "2"
bstr = "1"
aho-corasick = "1"
regex = "1"
ipnet = { version = "2", features = ["serde"] }
flate2 = "1"
zstd = "0.13"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate", "aes-crypto"] }
memmap2 = "0.9"
criterion = { version = "0.5", default-features = false }
csv = "1"
indicatif = "0.17"
crossbeam-channel = "0.5"
ratatui = "0.30"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
