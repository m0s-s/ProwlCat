[package]
name = "prowlcat-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "prowlcat"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
indicatif.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
prowlcat-core = { path = "../prowlcat-core" }
prowlcat-output = { path = "../prowlcat-output" }
prowlcat-source = { path = "../prowlcat-source" }
prowlcat-decode = { path = "../prowlcat-decode" }
prowlcat-index = { path = "../prowlcat-index" }
prowlcat-tui = { path = "../prowlcat-tui" }
rlimit = "0.10"

[dev-dependencies]
tempfile = "3"
flate2.workspace = true
zstd.workspace = true
tar.workspace = true
zip.workspace = true
bzip2.workspace = true
liblzma.workspace = true
sevenz-rust2 = { workspace = true, features = ["compress"] }
serde_json.workspace = true
rusqlite.workspace = true
bson.workspace = true
