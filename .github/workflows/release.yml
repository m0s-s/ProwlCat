name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Nothing is built or published unless the tests and the end-to-end suite pass on every platform,
  # and the tag matches the version in Cargo.toml and the change log.
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tag, Cargo.toml, CHANGELOG.md and screenshots agree
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          top=$(sed -n 's/^## \(.*\)/\1/p' CHANGELOG.md | head -1)
          echo "tag=$version Cargo.toml=$manifest CHANGELOG=$top"
          shots=$(cat assets/screenshots/VERSION)
          echo "screenshots=$shots"
          [ "$manifest" = "$version" ] && [ "$top" = "$version" ] && [ "$shots" = "$version" ]
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        if: matrix.os == 'ubuntu-22.04'
      - uses: EmbarkStudios/cargo-deny-action@v2
        if: matrix.os == 'ubuntu-22.04'
        with:
          command: check licenses bans sources

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is built on the oldest runner so the binary runs on older glibc too.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          # macos-13 is retired; macos-15-intel is the Intel runner that replaces it.
          - { target: x86_64-apple-darwin, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    env:
      # Windows: link the C runtime statically, so no Visual C++ Redistributable is needed.
      RUSTFLAGS: ${{ startsWith(matrix.os, 'windows') &&'-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p prowlcat-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="prowlcat-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          bin=target/${{ matrix.target }}/release/prowlcat
          [ "${{ runner.os }}" = "Windows" ] && bin="$bin.exe"
          cp "$bin" README.md LICENSE THIRD-PARTY-NOTICES.md "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name"
            asset="$name.zip"
          else
            tar czf "$name.tar.gz" "$name"
            asset="$name.tar.gz"
          fi
          sha256sum "$asset" > "$asset.sha256"
          echo "ASSET=$asset" >> "$GITHUB_ENV"
      - name: Smoke test and end-to-end tests on the packaged binary
        shell: bash
        run: |
          bin="prowlcat-${GITHUB_REF_NAME}-${{ matrix.target }}/prowlcat"
          [ "${{ runner.os }}" = "Windows" ] && bin="$bin.exe"
          "$bin" --version
          "$bin" --ui cli --help > /dev/null
          PROWLCAT_E2E_BIN="$GITHUB_WORKSPACE/$bin" PROWLCAT_E2E_EXPECT_VERSION="$GITHUB_REF_NAME" \
            cargo test -p prowlcat-cli --test e2e --locked
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          if-no-files-found: error

  # One release, created only when every platform built and passed: never a partial one.
  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
